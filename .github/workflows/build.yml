name: Build

on:
  push:
    branches: [misaka]
    tags: ['v*']
  pull_request:
    branches: [misaka]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 3.0.1)'
        required: true
        type: string
      create_release:
        description: 'Upload artifacts to a GitHub Release (tag v<version>)'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write package metadata
        shell: python
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          import json
          import os
          from pathlib import Path

          metadata = {
              "upgrade_guid": "46cbad92-353e-4b28-9bee-83950991dad8",
              "version": os.environ["VERSION"],
              "product_name": "VDI Client",
              "manufacturer": "Josh Patten",
              "name": "VDI Client",
              "name_base": "vdiclient",
              "arch": 64,
              "comments": (
                  "This is the Proxmox VDI client. "
                  "This client interfaces with Proxmox requires that virt-viewer be installed."
              ),
              "installdir": "VDIClient",
              "installscope": "perMachine",
              "license_file": "License.rtf",
              "startmenu_shortcut": "vdiclient.exe",
              "desktop_shortcut": "vdiclient.exe",
              "parts": [
                  {
                      "id": "MainProgram",
                      "title": "VDI Client",
                      "description": "Proxmox VDI Client",
                      "absent": "disallow",
                      "staged_dir": "vdiclient",
                  }
              ],
              "major_upgrade": {
                  "Schedule": "afterInstallInitialize",
                  "DowngradeErrorMessage": "A later version of [ProductName] is already installed",
                  "AllowSameVersionUpgrades": "yes",
              },
          }

          Path("dist").mkdir(exist_ok=True)
          Path("dist/vdiclient.json").write_text(
              json.dumps(metadata, indent="\t") + "\n",
              encoding="utf-8",
          )

      - name: Build executable with PyInstaller
        run: >
          pyinstaller
          --noconsole
          --noconfirm
          --name vdiclient
          --hidden-import proxmoxer.backends
          --hidden-import proxmoxer.backends.https
          --hidden-import proxmoxer.backends.https.AuthenticationError
          --hidden-import proxmoxer.core
          --hidden-import proxmoxer.core.ResourceException
          --hidden-import subprocess.TimeoutExpired
          --hidden-import subprocess.CalledProcessError
          --hidden-import requests.exceptions
          --hidden-import requests.exceptions.ReadTimeout
          --hidden-import requests.exceptions.ConnectTimeout
          --hidden-import requests.exceptions.RequestException
          --add-data "vdi\i18n\locales;vdi\i18n\locales"
          --noupx
          -i vdiicon.ico
          main.py

      - name: Copy assets into distribution folder
        run: |
          Copy-Item vdiclient.png dist\vdiclient\
          Copy-Item vdiicon.ico dist\vdiclient\

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $wixPaths = @(
            'C:\Program Files (x86)\Wix Toolset v3.14\bin\candle.exe',
            'C:\Program Files\Wix Toolset v3.14\bin\candle.exe'
          )
          if (-not ($wixPaths | Where-Object { Test-Path $_ })) {
            choco install wixtoolset -y --no-progress
          }

      - name: Build MSI
        working-directory: dist
        run: python createmsi.py vdiclient.json

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdiclient-msi
          path: dist/vdiclient-*.msi
          if-no-files-found: error

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev dpkg-dev fakeroot

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build DEB package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ARCH="$(dpkg --print-architecture)"
          PKG_NAME="vdiclient"
          DEB_FILE="dist/${PKG_NAME}_${VERSION}_${ARCH}.deb"
          STAGING="build/deb-root"

          pyinstaller \
            --onefile \
            --noconsole \
            --noconfirm \
            --name vdiclient \
            --hidden-import proxmoxer.backends \
            --hidden-import proxmoxer.backends.https \
            --hidden-import proxmoxer.backends.https.AuthenticationError \
            --hidden-import proxmoxer.core \
            --hidden-import proxmoxer.core.ResourceException \
            --hidden-import subprocess.TimeoutExpired \
            --hidden-import subprocess.CalledProcessError \
            --hidden-import requests.exceptions \
            --hidden-import requests.exceptions.ReadTimeout \
            --hidden-import requests.exceptions.ConnectTimeout \
            --hidden-import requests.exceptions.RequestException \
            --add-data "vdi/i18n/locales:vdi/i18n/locales" \
            main.py

          rm -rf "$STAGING"
          mkdir -p "$STAGING/DEBIAN"
          mkdir -p "$STAGING/usr/bin"
          mkdir -p "$STAGING/usr/share/applications"
          mkdir -p "$STAGING/usr/share/pixmaps"
          mkdir -p "$STAGING/usr/share/doc/${PKG_NAME}/examples"

          install -m 755 dist/vdiclient "$STAGING/usr/bin/vdiclient"
          install -m 644 vdiclient.png "$STAGING/usr/share/pixmaps/vdiclient.png"
          install -m 644 vdiclient.ini.example "$STAGING/usr/share/doc/${PKG_NAME}/examples/vdiclient.ini.example"
          install -m 644 LICENSE "$STAGING/usr/share/doc/${PKG_NAME}/copyright"

          cat > "$STAGING/usr/share/applications/vdiclient.desktop" <<'EOF'
          [Desktop Entry]
          Name=VDI Client
          Comment=Proxmox VDI Client
          Exec=vdiclient
          Icon=vdiclient
          Terminal=false
          Type=Application
          Categories=Network;RemoteAccess;
          StartupNotify=true
          EOF

          cat > "$STAGING/DEBIAN/control" <<EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Depends: virt-viewer
          Maintainer: Josh Patten <joshpatten@users.noreply.github.com>
          Description: Proxmox VDI Client
           Connect to Proxmox VE virtual machines via Spice using virt-viewer.
           .
           Configuration file locations:
            ~/.config/VDIClient/vdiclient.ini
            /etc/vdiclient/vdiclient.ini
          EOF

          fakeroot dpkg-deb --build "$STAGING" "$DEB_FILE"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdiclient-deb
          path: dist/vdiclient_*.deb
          if-no-files-found: error

  release:
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          name: Release v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
